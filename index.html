<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mya's World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a0a2e;display:flex;flex-direction:column;align-items:center;
     justify-content:center;height:100vh;overflow:hidden;touch-action:none}
canvas{display:block;image-rendering:pixelated;
       border:2px solid #cc6699;
       box-shadow:0 0 40px rgba(255,100,180,.4),0 0 80px rgba(180,60,120,.25)}
#ui{color:#cc88aa;font:9px monospace;margin-top:3px;letter-spacing:1px}
#touch-ui{position:fixed;bottom:0;left:0;right:0;height:150px;pointer-events:none;
          display:none;z-index:999;padding-bottom:env(safe-area-inset-bottom)}
#dpad{position:absolute;bottom:8px;left:8px;display:grid;
      grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;
      gap:4px;pointer-events:all}
#tr{position:absolute;bottom:8px;right:8px;display:flex;flex-direction:column;
    gap:6px;align-items:flex-end;pointer-events:all}
.tr-row{display:flex;flex-direction:row;gap:6px}
.tb{width:52px;height:52px;border-radius:50%;
    background:rgba(220,100,160,.35);
    border:2px solid rgba(255,160,200,.55);
    color:rgba(255,200,230,.95);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    user-select:none;cursor:pointer;touch-action:none;
    box-shadow:0 0 12px rgba(220,100,160,.3);transition:background .1s}
.tb:active,.tb.pressed{background:rgba(220,80,140,.65);border-color:rgba(255,140,200,.9)}
#centre-btns{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);
             pointer-events:all;display:flex;gap:8px}
@media(orientation:landscape){
  #touch-ui{height:120px}.tb{width:48px;height:48px;font-size:15px}
  body{justify-content:flex-start;padding-top:2px}
  canvas{max-height:calc(100vh - 120px)}
}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">ARROWS/WASD=MOVE | SPACE/UP=JUMP | DOWN=DROP | Z=BLAST | X=SPECIAL</div>
<div id="touch-ui">
  <div id="dpad">
    <div></div>
    <div class="tb" id="b-up" style="border-radius:12px;font-size:18px">&#9650;</div>
    <div></div>
    <div class="tb" id="b-left" style="border-radius:12px;font-size:18px">&#9664;</div>
    <div style="background:rgba(220,100,160,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,200,230,.3)">&#10010;</div>
    <div class="tb" id="b-right" style="border-radius:12px;font-size:18px">&#9654;</div>
    <div></div>
    <div class="tb" id="b-down" style="border-radi;font-size:18px">&#9660;</div>
    <div></div>
  </div>
  <div id="centre-btns">
    <div class="tb" id="b-start" style="width:66px;height:40px;border-radius:12px;font-size:10px;font-weight:bold;font-family:monospace;background:rgba(180,60,120,.55);border-color:rgba(255,140,200,.7)">&#9654; START</div>
    <div class="tb" id="b-special" style="width:66px;height:40px;border-radius:12px;font-size:10px;font-weight:bold;font-family:monospace;background:rgba(140,60,200,.5);border-color:rgba(200,140,255,.7)">&#9889; SPEC</div>
  </div>
  <div id="tr">
    <div class="tr-row">
      <div class="tb" id="b-jump" style="border-radius:50%">&#9650;<br><span style="font-size:8px">JUMP</span></div>
      <div class="tb" id="b-blast" style="border-radius:50%">&#128149;<br><span style="font-size:8px">BLAST</span></div>
    </div>
  </div>
</div>
<script>
'use strict';
var cv=document.getElementById('c');
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var W=Math.min(innerWidth-4,900);
var H=Math.min(innerHeight-(isTouch?150:40),520);
if(innerWidth>innerHeight&&isTouch)H=Math.min(innerHeight-120,520);
cv.width=W;cv.height=H;
var g=cv.getContext('2d');
if(!g.roundRect)g.roundRect=function(x,y,w,h,r){
  r=Math.min(+r||0,w/2,h/2);
  this.beginPath();this.moveTo(x+r,y);this.lineTo(x+w-r,y);
  this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
  this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
  this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);
  this.arcTo(x,y,x+r,y,r);this.closePath();return this;
};

// ── CONSTANTS ─────────────────────────────────────────────────
var FLOOR=H-60, WORLD=5500, GR=0.52;
var cam=0, tick=0, state='title';
var keys={}, _mx=0,_my=0;

// ── HELPERS ───────────────────────────────────────────────────
var _s=7;
function rnd(){_s=(_s*1664525+1013904223)|0;return((_s>>>0)/4294967295);}
function ri(a,b){return Math.floor(rnd()*(b-a)+a);}
function scx(wx){return wx-cam;}
function fRR(x,y,w,h,r,c){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();}
function fC(x,y,r,c){g.beginPath();g.arc(x,y,r,0,6.28);g.fillStyle=c;g.fill();}
function lbl(s,x,y,c,sz,al){g.font='bold '+(sz||13)+'px monospace';g.textAlign=al||'center';g.fillStyle=c||'#eec';g.fillText(s,x,y);}

// ── BOWS ─────────────────────────────────────────────────────
// Each bow: {x, y, size, tilt, speed, col, bobOffset}
var BOWS=[];
(function(){
  var bowCols=['#ff6eb4','#ff9ed2','#e91e8c','#ff4da6','#ff85c2','#cc1177','#ffb3d9'];
  for(var i=0;i<18;i++){
    BOWS.push({
      wx: ri(0,WORLD),          // world x (scrolls with camera)
      y:  ri(30,Math.floor(H*0.55)),
      size: ri(18,42),
      tilt: (rnd()-.5)*.6,
      spd:  rnd()*.3+.05,       // gentle float speed
      col:  bowCols[ri(0,bowCols.length)],
      col2: bowCols[ri(0,bowCols.length)],
      bob:  rnd()*6.28,
      shimmer: rnd()>.5
    });
  }
}());

function drawBow(bx,by,sz,tilt,col,col2,t){
  g.save();
  g.translate(bx,by);
  g.rotate(tilt+Math.sin(t*.7)*.04);
  var lw=sz*.13;
  // ── left loop ──
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(-sz*.9,-sz*.15,-sz*.85,-sz*.9,-sz*.35,-sz*.75);
  g.bezierCurveTo(-sz*.05,-sz*.6,0,-sz*.15,0,0);
  g.closePath();
  var lg=g.createLinearGradient(-sz*.6,-sz*.5,0,0);
  lg.addColorStop(0,col2);lg.addColorStop(1,col);
  g.fillStyle=lg;g.fill();
  // sheen on left loop
  g.globalAlpha=.28;
  g.beginPath();
  g.moveTo(-sz*.1,-sz*.08);
  g.bezierCurveTo(-sz*.5,-sz*.12,-sz*.65,-sz*.55,-sz*.4,-sz*.65);
  g.bezierCurveTo(-sz*.2,-sz*.7,-sz*.05,-sz*.3,-sz*.1,-sz*.08);
  g.fillStyle='rgba(255,255,255,.9)';g.fill();
  g.globalAlpha=1;
  // ── right loop ──
  g.beginPath();
  g.moveTo(0,0);
  g.bezierCurveTo(sz*.9,-sz*.15,sz*.85,-sz*.9,sz*.35,-sz*.75);
  g.bezierCurveTo(sz*.05,-sz*.6,0,-sz*.15,0,0);
  g.closePath();
  var rg=g.createLinearGradient(sz*.6,-sz*.5,0,0);
  rg.addColorStop(0,col2);rg.addColorStop(1,col);
  g.fillStyle=rg;g.fill();
  g.globalAlpha=.22;
  g.beginPath();
  g.moveTo(sz*.1,-sz*.08);
  g.bezierCurveTo(sz*.5,-sz*.12,sz*.65,-sz*.55,sz*.4,-sz*.65);
  g.bezierCurveTo(sz*.2,-sz*.7,sz*.05,-sz*.3,sz*.1,-sz*.08);
  g.fillStyle='rgba(255,255,255,.9)';g.fill();
  g.globalAlpha=1;
  // ── left tail ──
  g.beginPath();
  g.moveTo(-lw*.5,0);
  g.bezierCurveTo(-sz*.5,sz*.4,-sz*.7,sz*.85,-sz*.5,sz*1.1);
  g.bezierCurveTo(-sz*.4,sz*1.25,-sz*.1,sz*.8,lw*.5,sz*.25);
  g.closePath();
  g.fillStyle=col;g.fill();
  // ── right tail ──
  g.beginPath();
  g.moveTo(lw*.5,0);
  g.bezierCurveTo(sz*.5,sz*.4,sz*.7,sz*.85,sz*.5,sz*1.1);
  g.bezierCurveTo(sz*.4,sz*1.25,sz*.1,sz*.8,-lw*.5,sz*.25);
  g.closePath();
  g.fillStyle=col2;g.fill();
  // ── knot ──
  fC(0,-sz*.05,sz*.16,'#fff0f8');
  fC(0,-sz*.05,sz*.1,col);
  // outline
  g.beginPath();g.arc(0,-sz*.05,sz*.16,0,6.28);
  g.strokeStyle=col2;g.lineWidth=sz*.04;g.stroke();
  g.restore();
}

// ── SUNSET BACKGROUND ─────────────────────────────────────────
function drawBG(){
  // Sky gradient — deep purple → hot pink → coral → amber
  var sky=g.createLinearGradient(0,0,0,FLOOR);
  sky.addColorStop(0,  '#1a0635');
  sky.addColorStop(.18,'#4a1060');
  sky.addColorStop(.38,'#8e2070');
  sky.addColorStop(.6, '#cc4488');
  sky.addColorStop(.78,'#e8785a');
  sky.addColorStop(.92,'#f4a04a');
  sky.addColorStop(1,  '#f8c060');
  g.fillStyle=sky;g.fillRect(0,0,W,FLOOR);

  // Sun disc
  var sx=W*.72,sy=FLOOR*.52;
  var sunGlow=g.createRadialGradient(sx,sy,0,sx,sy,120);
  sunGlow.addColorStop(0,'rgba(255,240,180,1)');
  sunGlow.addColorStop(.25,'rgba(255,200,100,.7)');
  sunGlow.addColorStop(.6,'rgba(255,140,80,.25)');
  sunGlow.addColorStop(1,'rgba(255,100,60,0)');
  g.fillStyle=sunGlow;g.fillRect(0,0,W,FLOOR);
  // Hard sun circle
  fC(sx,sy,36,'rgba(255,245,200,.95)');
  fC(sx,sy,26,'rgba(255,255,240,1)');

  // Horizon glow band
  var hg=g.createLinearGradient(0,FLOOR-80,0,FLOOR);
  hg.addColorStop(0,'rgba(255,180,100,0)');
  hg.addColorStop(1,'rgba(255,140,80,.35)');
  g.fillStyle=hg;g.fillRect(0,FLOOR-80,W,80);

  // Soft cloud wisps
  g.globalAlpha=.18;
  [[W*.08,H*.12,180,28],[W*.4,H*.08,240,22],[W*.75,H*.18,160,20],
   [W*.25,H*.22,120,16],[W*.6,H*.28,200,18]].forEach(function(c){
    var cg=g.createRadialGradient(c[0],c[1],0,c[0],c[1],c[2]);
    cg.addColorStop(0,'rgba(255,220,240,.9)');
    cg.addColorStop(1,'rgba(255,200,220,0)');
    g.fillStyle=cg;
    g.beginPath();g.ellipse(c[0],c[1],c[2],c[3],0,0,6.28);g.fill();
  });
  g.globalAlpha=1;

  // Sparkle stars (just visible at top)
  g.fillStyle='rgba(255,220,255,.7)';
  [[W*.05,H*.04],[W*.18,H*.07],[W*.33,H*.02],[W*.55,H*.06],
   [W*.67,H*.03],[W*.82,H*.08],[W*.91,H*.04]].forEach(function(p,i){
    var pulse=.5+.5*Math.abs(Math.sin(tick*.04+i));
    g.globalAlpha=pulse*.7;
    fC(p[0],p[1],1.5,'#ffe0ff');
  });
  g.globalAlpha=1;

  // Ground / floor strip
  var gnd=g.createLinearGradient(0,FLOOR,0,H);
  gnd.addColorStop(0,'#4a1a3a');
  gnd.addColorStop(.3,'#2e0e28');
  gnd.addColorStop(1,'#1a0818');
  g.fillStyle=gnd;g.fillRect(0,FLOOR,W,H-FLOOR);

  // Ground edge highlight
  g.strokeStyle='rgba(255,120,180,.4)';g.lineWidth=2;
  g.beginPath();g.moveTo(0,FLOOR);g.lineTo(W,FLOOR);g.stroke();

  // Bows in the sky (world-scrolling)
  BOWS.forEach(function(bw){
    var sx2=scx(bw.wx);
    if(sx2<-80||sx2>W+80)return;
    bw.bob+=bw.spd;
    var floatY=bw.y+Math.sin(bw.bob)*(bw.size*.18);
    g.globalAlpha=.82+.18*Math.abs(Math.sin(bw.bob*.7));
    drawBow(sx2,floatY,bw.size,bw.tilt,bw.col,bw.col2,tick*.04+bw.bob);
    g.globalAlpha=1;
  });
}

// ── TITLE SCREEN ──────────────────────────────────────────────
var _btnX=0,_btnY=0,_btnW=220,_btnH=52;
function drawTitle(){
  drawBG();
  // Title card
  g.globalAlpha=.82;
  fRR(W/2-200,H/2-100,400,200,24,'rgba(30,5,25,.85)');
  g.strokeStyle='rgba(255,140,200,.6)';g.lineWidth=2;
  g.beginPath();g.roundRect(W/2-200,H/2-100,400,200,24);g.stroke();
  g.globalAlpha=1;

  // Decorative bows on title card corners
  drawBow(W/2-178,H/2-82,18,-.3,'#ff6eb4','#ff9ed2',tick*.03);
  drawBow(W/2+178,H/2-82,18,.3,'#e91e8c','#ff85c2',tick*.03);

  // Title text
  g.font='bold 42px serif';g.textAlign='center';
  g.fillStyle='rgba(255,160,200,.18)';g.fillText("Mya's World",W/2+2,H/2-40+2);
  var tg=g.createLinearGradient(W/2-120,H/2-60,W/2+120,H/2-30);
  tg.addColorStop(0,'#ff9ed2');tg.addColorStop(.5,'#fff0f8');tg.addColorStop(1,'#ff6eb4');
  g.fillStyle=tg;g.fillText("Mya's World",W/2,H/2-40);

  lbl('✨ A Coquette Adventure ✨',W/2,H/2-8,'rgba(255,180,220,.8)',11);

  // Play button
  var bx=W/2-_btnW/2,by=H/2+28;
  _btnX=bx;_btnY=by;
  var hover=_mx>bx&&_mx<bx+_btnW&&_my>by&&_my<by+_btnH;
  var bg=g.createLinearGradient(bx,by,bx+_btnW,by+_btnH);
  bg.addColorStop(0,hover?'#e8006a':'#aa004e');
  bg.addColorStop(1,hover?'#ff6eb4':'#cc3388');
  fRR(bx+3,by+3,_btnW,_btnH,14,'rgba(0,0,0,.3)');
  g.beginPath();g.roundRect(bx,by,_btnW,_btnH,14);g.fillStyle=bg;g.fill();
  g.strokeStyle='rgba(255,180,220,.7)';g.lineWidth=2;
  g.beginPath();g.roundRect(bx,by,_btnW,_btnH,14);g.stroke();
  lbl('▶  PLAY',W/2,by+34,'#fff0f8',18);

  // Pulse bow on button
  var pulse=.85+.15*Math.abs(Math.sin(tick*.06));
  g.globalAlpha=pulse;
  drawBow(bx+22,by+_btnH/2,14,.1,'#fff0f8','#ffccee',tick*.05);
  drawBow(bx+_btnW-22,by+_btnH/2,14,-.1,'#fff0f8','#ffccee',tick*.05);
  g.globalAlpha=1;
}

// ── MAIN LOOP (title only for now) ───────────────────────────
function loop(){
  requestAnimationFrame(loop);
  tick++;
  if(state==='title'){drawTitle();return;}
  drawBG();
  // Game loop goes here as we build it out
}

// ── INPUT ─────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(state==='title'&&(e.code==='Space'||e.code==='Enter')){
    state='play';
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',function(e){delete keys[e.code];});
cv.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect();_mx=e.clientX-r.left;_my=e.clientY-r.top;
});
cv.addEventListener('click',function(e){
  var r=cv.getBoundingClientRect();
  var cx=e.clientX-r.left,cy=e.clientY-r.top;
  if(state==='title'&&cx>_btnX&&cx<_btnX+_btnW&&cy>_btnY&&cy<_btnY+_btnH){
    state='play';
  }
});
cv.addEventListener('touchend',function(e){
  var r=cv.getBoundingClientRect();var t=e.changedTouches[0];
  var cx=t.clientX-r.left,cy=t.clientY-r.top;
  if(state==='title'&&cx>_btnX&&cx<_btnX+_btnW&&cy>_btnY&&cy<_btnY+_btnH){
    e.preventDefault();state='play';
  }
},{passive:false});

// Touch UI
if(isTouch){
  document.getElementById('touch-ui').style.display='block';
  document.getElementById('ui').style.display='none';
}

loop();
</script></body></html>
